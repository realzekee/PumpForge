<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A comprehensive crypto meme coin trading simulator, prediction markets, and arcade platform." />
    <meta property="og:title" content="PumpForge" />
    <meta property="og:description" content="A comprehensive crypto meme coin trading simulator, prediction markets, and arcade platform." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>PumpForge</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body style="background-color:#0d0d10;margin:0;">
    <div id="root">
      <div style="position:fixed;inset:0;background-color:#0d0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Inter,system-ui,-apple-system,sans-serif;color:#f4f4f5;overflow:hidden;user-select:none;z-index:9999;">
        <style>
          @keyframes pf-spin { to { transform: rotate(360deg); } }
        </style>
        <div style="background:#141417;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px 24px;width:280px;display:flex;flex-direction:column;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,0.6);">
          <div style="position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
            <div style="position:absolute;inset:0;border-radius:16px;border:2px solid rgba(249,115,22,0.2);border-top-color:#f97316;animation:pf-spin 1s linear infinite;"></div>
            <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f97316,#f59e0b,#ea580c);display:flex;align-items:center;justify-content:center;color:#09090b;font-size:20px;font-weight:800;">
              🪙
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span style="font-size:17px;font-weight:700;letter-spacing:-0.01em;color:#ffffff;">PumpForge</span>
            <span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(249,115,22,0.16);border:1px solid rgba(249,115,22,0.35);color:#fdba74;">LIVE</span>
          </div>
          <div style="font-size:12px;color:#a1a1aa;margin-bottom:14px;">Loading workspace...</div>
          <div style="width:100%;height:5px;background:#0e0e11;border-radius:9999px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
            <div style="height:100%;width:72%;background:linear-gradient(90deg,#f97316,#f59e0b,#fb923c);border-radius:9999px;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
