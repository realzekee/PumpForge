<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A comprehensive crypto meme coin trading simulator and arcade game. Trade, create custom coins, place predictions, play arcade games, and prestige." />
    <meta property="og:title" content="PumpForge" />
    <meta property="og:description" content="A comprehensive crypto meme coin trading simulator and arcade game. Trade, create custom coins, place predictions, play arcade games, and prestige." />
    <link rel="manifest" href="/manifest.json" />
    <title>PumpForge</title>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background-color:#07070b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#ffffff;overflow:hidden;user-select:none;z-index:9999;">
        <style>
          @keyframes pf-spin { to { transform: rotate(360deg); } }
          @keyframes pf-pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }
        </style>
        <div style="position:absolute;top:-10%;left:-10%;width:60vw;height:60vw;max-width:500px;max-height:500px;border-radius:50%;background:radial-gradient(circle,rgba(225,29,72,0.18) 0%,transparent 70%);filter:blur(80px);pointer-events:none;"></div>
        <div style="position:absolute;bottom:-10%;right:-10%;width:60vw;height:60vw;max-width:500px;max-height:500px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.15) 0%,transparent 70%);filter:blur(80px);pointer-events:none;"></div>
        
        <div style="position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#f43f5e;border-right-color:rgba(245,158,11,0.5);animation:pf-spin 2.2s linear infinite;"></div>
          <div style="position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);"></div>
          <div style="position:relative;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#e11d48,#dc2626,#ea580c);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(225,29,72,0.4);border:1px solid rgba(255,255,255,0.25);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="rgba(255,255,255,0.25)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
            </svg>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-size:22px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;">PumpForge</span>
          <span style="font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.3);color:#fb7185;">PRO</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-size:10px;color:#a1a1aa;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:20px;">
          <span style="width:6px;height:6px;border-radius:50%;background-color:#34d399;display:inline-block;box-shadow:0 0 6px #34d399;"></span>
          <span>High-Frequency Trading Platform</span>
        </div>

        <div style="width:200px;height:4px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden;position:relative;margin-bottom:12px;">
          <div style="position:absolute;inset:0;background:linear-gradient(90deg,#f43f5e,#f59e0b);width:70%;border-radius:9999px;"></div>
        </div>
        <div style="font-size:11px;color:#d4d4d8;font-weight:700;letter-spacing:0.02em;">
          Igniting Forge Engine...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
